# Host nginx site for demo.sub-zero.dev. Install once (see DEPLOY.md):
#   cp deploy/nginx/demo.sub-zero.dev.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/demo.sub-zero.dev.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d demo.sub-zero.dev
# certbot adds the 443 server block and the HTTP->HTTPS redirect itself.

map $http_upgrade $demo_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name demo.sub-zero.dev;

  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the API trusts one hop for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $demo_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
