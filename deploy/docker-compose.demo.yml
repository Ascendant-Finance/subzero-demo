# demo.sub-zero.dev, on the droplet that also runs the SubZero API.
#
# Images are built in GitHub Actions and pulled here; nothing is compiled on the
# droplet, which serves production SubZero and cannot spare a Next.js build.
# Postgres and Redis are this stack's own, so a prospect's sandbox never shares
# a database with SubZero. Only loopback ports are published: the host's nginx
# terminates TLS and proxies to them (deploy/nginx/demo.sub-zero.dev.conf).
name: subzero-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d demo']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m

  api:
    image: ghcr.io/ascendant-finance/subzero-demo-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://demo:${POSTGRES_PASSWORD}@postgres:5432/demo
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 14d
      WEB_ORIGIN: https://demo.sub-zero.dev
      COOKIE_DOMAIN: demo.sub-zero.dev
      UPLOAD_MAX_BYTES: 5242880
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      SUBZERO_URL: ${SUBZERO_URL:-https://api.sub-zero.dev/incidents/external}
      DEMO_MODE: 'true'
      SUBZERO_DEMO_PROVISION_URL: ${SUBZERO_DEMO_PROVISION_URL:-https://api.sub-zero.dev/demo/provision}
      DEMO_PROVISION_SECRET: ${DEMO_PROVISION_SECRET:?set DEMO_PROVISION_SECRET}
      DEMO_REPO_URL: ${DEMO_REPO_URL:-https://github.com/Ascendant-Finance/subzero-demo}
      SUBZERO_DASHBOARD_URL: ${SUBZERO_DASHBOARD_URL:-https://dashboard.sub-zero.dev}
      SUBZERO_PUBLIC_API_URL: ${SUBZERO_PUBLIC_API_URL:-https://api.sub-zero.dev}
      DEMO_SIGNUPS_PER_IP_PER_HOUR: ${DEMO_SIGNUPS_PER_IP_PER_HOUR:-5}
      DEMO_SIGNUPS_PER_DAY: ${DEMO_SIGNUPS_PER_DAY:-200}
      DEMO_LEAD_WEBHOOK_URL: ${DEMO_LEAD_WEBHOOK_URL:-}
    ports:
      - '127.0.0.1:3101:4000'
    mem_limit: 384m

  web:
    image: ghcr.io/ascendant-finance/subzero-demo-web:${IMAGE_TAG}
    restart: always
    depends_on:
      - api
    ports:
      - '127.0.0.1:3100:3000'
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
