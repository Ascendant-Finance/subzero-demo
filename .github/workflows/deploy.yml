name: Deploy demo.sub-zero.dev

# Not gated on CI: the e2e suite is red by design until someone fixes the planted
# faults, so "CI passed" would mean "never deploy". The gate below is what a
# deploy actually needs — it compiles, it lints, it builds.
#
# Images are built here and pushed to GHCR; the droplet only pulls and restarts,
# because it also serves production SubZero and a Next.js build there would
# starve it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trello-clone/shared build
      - run: pnpm --filter api exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r lint

  images:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/ascendant-finance/subzero-demo-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/ascendant-finance/subzero-demo-web:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://demo.sub-zero.dev
            NEXT_PUBLIC_WS_URL=https://demo.sub-zero.dev
            NEXT_PUBLIC_DEMO_MODE=true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Ship the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEMO_DO_HOST }}
          username: ${{ secrets.DEMO_DO_USERNAME }}
          key: ${{ secrets.DEMO_DO_SSH_KEY }}
          source: deploy/docker-compose.demo.yml
          target: /root/subzero-demo
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEMO_DO_HOST }}
          username: ${{ secrets.DEMO_DO_USERNAME }}
          key: ${{ secrets.DEMO_DO_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -e
            cd /root/subzero-demo
            # .env holds the secrets (see DEPLOY.md); IMAGE_TAG is the only thing
            # this job changes in it.
            test -f .env || { echo "/root/subzero-demo/.env is missing — see DEPLOY.md"; exit 1; }
            sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            docker compose -f docker-compose.demo.yml pull
            docker compose -f docker-compose.demo.yml up -d --remove-orphans
            docker image prune -f >/dev/null

            # 401 from /auth/me means the API is up and answering.
            for i in $(seq 1 36); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/auth/me || true)
              web=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/start || true)
              if [ "$code" = "401" ] && [ "$web" = "200" ]; then echo "healthy after $((i*5))s"; exit 0; fi
              sleep 5
            done
            echo "demo did not become healthy (api=$code web=$web)"
            docker compose -f docker-compose.demo.yml logs --tail=80 api web
            exit 1
