name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trelloclone_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trelloclone_test
  REDIS_URL: redis://localhost:6379
  TEST_REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci_access_secret
  JWT_REFRESH_SECRET: ci_refresh_secret
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  WEB_ORIGIN: http://localhost:3000
  COOKIE_DOMAIN: localhost
  UPLOAD_MAX_BYTES: '26214400'
  SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
  SPACES_REGION: nyc3
  SPACES_BUCKET: trello-clone-uploads
  SPACES_KEY: ci-key
  SPACES_SECRET: ci-secret
  SPACES_PUBLIC_BASE_URL: https://cdn.example.com
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_WS_URL: http://localhost:4000

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trelloclone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @trello-clone/shared build

      - name: Generate the prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Shared unit tests
        run: pnpm --filter @trello-clone/shared test

      - name: Web unit tests
        run: pnpm --filter web test

      - name: API e2e tests
        run: pnpm --filter api test:e2e

      - name: Build the api and the web app
        run: pnpm --filter api build && pnpm --filter web build

      - name: Install the playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser tests
        run: |
          pnpm --filter api exec node dist/main.js &
          pnpm --filter web exec next start -p 3000 &
          npx wait-on http://localhost:4000/api/auth/me http://localhost:3000/login --timeout 90000
          pnpm --filter web exec playwright test

      - name: Upload the playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
